<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 每日練習 Day 26（2026-11-23）</title><link rel="stylesheet" href="style.css"></head><body><main></main><script>window.TOPIC="toeic-031049f6a9e969e4a473d8ce451b3275";window.DAY={"day": 26, "date": "2026-11-23", "title": "TOEIC 每日練習 Day 26（2026-11-23）", "summary": "最新成績仍是 Day 15 的 15/25，Day 16 之後還沒收到交卷。今天繼續加強：leave／find／consider + 受詞 + 形容詞（含 remarkably quick 副詞對照），以及閱讀、聽力的「時間與數字干擾」。另外複習 if 子句配 will／could、Despite／Although、comply with、whose／who、be responsible for、on + 日期。聽力今天是 Part 4 電話留言。做完按「交卷」就會自動回傳成績", "sections": [{"kind": "p5", "heading": "Part 5 文法與字彙（建議 11 分鐘）", "tip": "leave／find／consider + 受詞 + 空格：描述受詞用形容詞（very 後面也是形容詞）；空格後面若還有形容詞，空格就是副詞。假設語氣先看主要子句：will 配 if 現在式，would／could 配 if 過去式。Although 接句子，Despite 接名詞。日期用 on。", "qs": [{"n": 1, "stem": "If the client ------- the contract today, we will start the project next week.", "opts": ["sign", "signs", "signed", "would sign"], "ans": 1, "exp": "判斷步驟：1. 主要子句 will start ＝ 真實可能發生。2. if 子句用現在式，the client 單數用 signs。3. 選 B。"}, {"n": 2, "stem": "If we ------- a larger budget, we could hire two more designers.", "opts": ["have", "will have", "had", "are having"], "ans": 2, "exp": "判斷步驟：1. 主要子句 could hire ＝ 與現在事實相反（其實預算不夠）。2. if 子句用過去式 had。3. 選 C。"}, {"n": 3, "stem": "Please leave the conference room door ------- after the meeting.", "opts": ["open", "openly", "opening", "opener"], "ans": 0, "exp": "判斷步驟：1. leave + 受詞（the door）+ 空格，描述門的狀態。2. 狀態用形容詞 open（開著的）。3. 選 A。"}, {"n": 4, "stem": "Customers found the checkout process ------- quick.", "opts": ["remarkable", "remarkably", "remark", "remarked"], "ans": 1, "exp": "判斷步驟：1. find + 受詞 + 空格 + quick。2. 空格後已經有形容詞 quick，空格修飾 quick，用副詞 remarkably。3. 選 B。口訣：空格後還有形容詞 → 副詞；沒有 → 形容詞。"}, {"n": 5, "stem": "The manager considered the new schedule very -------.", "opts": ["help", "helpfully", "helpful", "helps"], "ans": 2, "exp": "判斷步驟：1. consider + 受詞（the new schedule）+ very + 空格。2. very 後面、而且後面沒有其他形容詞 → 用形容詞 helpful。3. 選 C。"}, {"n": 6, "stem": "------- the heavy traffic, Ms. Chen arrived at the meeting on time.", "opts": ["Although", "Even though", "Despite", "Because"], "ans": 2, "exp": "判斷步驟：1. the heavy traffic 是名詞片語，沒有動詞。2. 讓步接名詞用介系詞 Despite。3. 選 C。Although／Even though 都要接句子。"}, {"n": 7, "stem": "------- the store opened late, it had many customers.", "opts": ["Despite", "Although", "In spite of", "Because of"], "ans": 1, "exp": "判斷步驟：1. 空格後有主詞 the store＋動詞 opened，是句子。2. 讓步接句子用 Although。3. 選 B。"}, {"n": 8, "stem": "All employees must comply ------- the new travel policy.", "opts": ["with", "to", "by", "on"], "ans": 0, "exp": "判斷步驟：comply with ＝ 遵守。看到 comply 直接選 with。"}, {"n": 9, "stem": "The company hired a designer ------- work has won several awards.", "opts": ["who", "whose", "which", "whom"], "ans": 1, "exp": "判斷步驟：1. 空格後先出現名詞 work，再接動詞 has won。2. 「那位設計師『的』作品」。3. 選 whose。"}, {"n": 10, "stem": "Ms. Park is responsible ------- training new staff members.", "opts": ["of", "with", "for", "in"], "ans": 2, "exp": "判斷步驟：1. be responsible for ＝ 負責。2. 選 C。對照：be in charge of 用 of，別混。"}, {"n": 11, "stem": "The new branch will open ------- April 3.", "opts": ["in", "at", "on", "for"], "ans": 2, "exp": "判斷步驟：1. 時刻用 at；星期、日期用 on；月份、年份用 in。2. April 3 是日期，選 C。若只有 April 才用 in。"}]}, {"kind": "p7", "heading": "Part 7 短篇閱讀（建議 9 分鐘）", "tip": "先讀題目、圈關鍵字（Why send、When available、asked to do、NOT），再回原文找那一句。注意「平常時間」「開始時間」「結束時間」和分機號碼都是干擾；instead of 前面是新選擇。", "passage": ["E-mail", "From: Daniel Wu, Office Manager / To: All Staff / Subject: Elevator Maintenance", "Dear Staff, The main elevator in our building will be out of service on Wednesday, December 2, from 8:00 A.M. to 1:00 P.M. for its yearly inspection. The building usually opens at 7:30 A.M., and this will not change.", "During this time, please use the service elevator at the back of the building instead of the main elevator. Deliveries scheduled for that morning have been moved to the afternoon.", "If you need help carrying heavy items, contact the front desk at extension 210. Thank you for your understanding."], "qs": [{"n": 12, "stem": "Why did Mr. Wu send the e-mail?", "opts": ["To announce a new office location", "To explain a temporary elevator closure", "To ask staff to work late", "To introduce a new front desk worker"], "ans": 1, "exp": "判斷步驟：1. 目的題看主旨和第一句：Elevator Maintenance、will be out of service。2. 暫時停用 ＝ temporary closure。3. 選 B。"}, {"n": 13, "stem": "When will the main elevator be available again?", "opts": ["At 7:30 A.M.", "At 8:00 A.M.", "At 1:00 P.M.", "At 2:10 P.M."], "ans": 2, "exp": "判斷步驟：1. from 8:00 A.M. to 1:00 P.M. → 1 點後恢復。2. 選 C。A 是大樓平常開門時間；B 是停用開始時間；D 用分機 210 的數字混淆，是數字干擾。"}, {"n": 14, "stem": "What are staff asked to do?", "opts": ["Use the service elevator", "Arrive at 8:00 A.M.", "Cancel their deliveries", "Use the main elevator after 7:30"], "ans": 0, "exp": "判斷步驟：1. please use the service elevator … instead of the main elevator。2. instead of 前面是要用的新選擇。3. 選 A。C 錯：送貨是「改到下午」不是取消。"}, {"n": 15, "stem": "What is NOT mentioned in the e-mail?", "opts": ["The reason for the closure", "A phone extension for help", "The cost of the inspection", "A change to delivery times"], "ans": 2, "exp": "判斷步驟：1. NOT 題逐一對照：原因 yearly inspection 有；分機 210 有；送貨改到下午有。2. 費用沒提到。3. 選 C。"}]}, {"kind": "part2", "heading": "Part 2 聽力應答（建議 6 分鐘）", "tip": "先聽清楚第一個字（Why don't we／or／When／Didn't／Who／How long）。建議句不選 Because；A or B 問句和 Wh 問句不選 Yes。重複題目的字或發音相近的字（red／read、launch／lunch、check／kitchen）通常是陷阱。", "qs": [{"n": 16, "stem": "Why don't we order lunch for the team?", "opts": ["Because it was late.", "That's a great idea.", "I ate at noon yesterday."], "ans": 1, "exp": "判斷步驟：1. Why don't we…? ＝ 建議「我們何不……」。2. B 接受建議。3. A 是 Because 陷阱；C 用 lunch／noon 相關字陷阱。", "audio": "d26_16.mp3"}, {"n": 17, "stem": "Would you like the blue folder or the red one?", "opts": ["Yes, I would.", "The red one, please.", "I read it already."], "ans": 1, "exp": "判斷步驟：1. A or B 選擇疑問句，先刪 Yes。2. B 選紅色。3. C 用 red／read 同音陷阱。", "audio": "d26_17.mp3"}, {"n": 18, "stem": "When is the new product launch?", "opts": ["Next Thursday morning.", "I had lunch already.", "In the conference room."], "ans": 0, "exp": "判斷步驟：1. When 問時間。2. A 回答時間。3. B 用 launch／lunch 發音相近陷阱；C 回答地點（Where）。", "audio": "d26_18.mp3"}, {"n": 19, "stem": "Didn't you check the schedule?", "opts": ["Yes, it starts at nine.", "A check for fifty dollars.", "He's in the kitchen."], "ans": 0, "exp": "判斷步驟：1. 把 not 拿掉：Did you check the schedule?。2. A「有，九點開始」。3. B 用 check（支票）同字異義陷阱；C 用 check／kitchen 發音相近陷阱。", "audio": "d26_19.mp3"}, {"n": 20, "stem": "Who will pick up the visitors from the airport?", "opts": ["Yes, at the airport.", "Mr. Kim will.", "Around three o'clock."], "ans": 1, "exp": "判斷步驟：1. Who 問人。2. B 回答人名。3. A 是 Yes 陷阱又重複 airport；C 回答時間。", "audio": "d26_20.mp3"}, {"n": 21, "stem": "How long will the repair take?", "opts": ["About two hours.", "It's very long.", "Ten dollars, please."], "ans": 0, "exp": "判斷步驟：1. How long 問多久。2. A「大約兩小時」。3. B 重複 long；C 回答價錢（How much）。", "audio": "d26_21.mp3"}]}, {"kind": "talk", "heading": "Part 4 電話留言（建議 4 分鐘）", "tip": "播放前先讀三題，圈出 Why calling、When、ask to do。留言會出現原本時間和新時間，選 instead 後面的新時間。最後一句通常是要求，注意 call back ＝ return a call。", "audio": "d26_S.mp3", "script": ["Hello, this is Karen from Bright Office Supplies, calling for Mr. Ellis.", "You ordered twenty boxes of printer paper for delivery on Monday at nine A.M.", "Unfortunately, our truck is being repaired, so we can't deliver on Monday.", "We can bring your order on Tuesday at eleven A.M. instead, and we'll take ten percent off the price.", "Please call me back at five five five, three two one zero to confirm. Thank you."], "qs": [{"n": 22, "stem": "Why is the speaker calling?", "opts": ["To take a new order", "To report a delivery change", "To ask for payment", "To offer a job"], "ans": 1, "exp": "判斷步驟：1. 目的題聽前半：we can't deliver on Monday … on Tuesday instead。2. 送貨改期。3. 選 B。"}, {"n": 23, "stem": "When will the order most likely be delivered?", "opts": ["Monday at 9 A.M.", "Monday at 11 A.M.", "Tuesday at 9 A.M.", "Tuesday at 11 A.M."], "ans": 3, "exp": "判斷步驟：1. on Tuesday at eleven A.M. instead。2. Monday 9 A.M. 是原本時間；B、C 是新舊時間混搭干擾。3. 選 D。"}, {"n": 24, "stem": "What does the speaker ask Mr. Ellis to do?", "opts": ["Return a call", "Visit the store", "Pay by Monday", "Cancel the order"], "ans": 0, "exp": "判斷步驟：1. 最後一句 Please call me back … to confirm。2. call back ＝ return a call（換句話說）。3. 選 A。"}]}]};</script><script src="app.js"></script></body></html>
