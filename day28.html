<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 每日練習 Day 28（2026-11-25）</title><link rel="stylesheet" href="style.css"></head><body><main></main><script>window.TOPIC="toeic-031049f6a9e969e4a473d8ce451b3275";window.DAY={"day": 28, "date": "2026-11-25", "title": "TOEIC 每日練習 Day 28（2026-11-25）", "summary": "最新成績仍是 Day 15 的 15/25，Day 16 之後還沒收到交卷。今天繼續加強：leave／find／consider + 受詞 + 形容詞（含 remarkably quick 副詞對照），以及閱讀、聽力的「時間與數字干擾」。另外複習 if 子句配 will／could、Despite／Although、comply with、whose／who、be responsible for、on + 日期。聽力今天是 Part 4 電話留言。做完按「交卷」就會自動回傳成績", "sections": [{"kind": "p5", "heading": "Part 5 文法與字彙（建議 11 分鐘）", "tip": "leave／find／consider + 受詞 + 空格：描述受詞用形容詞（very 後面也是形容詞）；空格後面若還有形容詞，空格就是副詞。假設語氣先看主要子句：will 配 if 現在式，would／could 配 if 過去式。Although 接句子，Despite 接名詞。日期用 on。", "qs": [{"n": 1, "stem": "If the client ------- the contract today, we will start the project next week.", "opts": ["sign", "signs", "signed", "would sign"], "ans": 1, "exp": "判斷步驟：1. 主要子句 will start ＝ 真實可能發生。2. if 子句用現在式，the client 單數用 signs。3. 選 B。"}, {"n": 2, "stem": "If we ------- a larger office, we could hire more staff.", "opts": ["have", "had", "will have", "has"], "ans": 1, "exp": "判斷步驟：1. 主要子句 could hire ＝ 與現在事實相反（其實辦公室不夠大）。2. if 子句用過去式 had。3. 選 B。"}, {"n": 3, "stem": "Please leave the meeting room door ------- during the inspection.", "opts": ["open", "openly", "opening", "opened up"], "ans": 0, "exp": "判斷步驟：1. leave + 受詞（the meeting room door）+ 空格，描述門的狀態。2. 狀態用形容詞 open（開著的）。3. 選 A。"}, {"n": 4, "stem": "Customers found the new checkout process ------- quick.", "opts": ["remarkable", "remarkably", "remark", "remarked"], "ans": 1, "exp": "判斷步驟：1. find + 受詞 + 空格 + quick。2. 空格後已經有形容詞 quick，空格修飾 quick，用副詞 remarkably。3. 選 B。口訣：空格後還有形容詞 → 副詞；沒有 → 形容詞。"}, {"n": 5, "stem": "The manager considers the new software very -------.", "opts": ["help", "helpful", "helpfully", "helped"], "ans": 1, "exp": "判斷步驟：1. consider + 受詞（the new software）+ very + 空格。2. very 後面要接形容詞，而且後面沒有其他形容詞 → helpful。3. 選 B。"}, {"n": 6, "stem": "------- the heavy traffic, Mr. Chen arrived at the airport on time.", "opts": ["Although", "Despite", "Even though", "Because"], "ans": 1, "exp": "判斷步驟：1. the heavy traffic 是名詞，沒有動詞。2. 讓步接名詞用介系詞 Despite。3. 選 B。Although／Even though 都要接句子。"}, {"n": 7, "stem": "------- the budget was small, the event was a great success.", "opts": ["Despite", "In spite of", "Although", "Because of"], "ans": 2, "exp": "判斷步驟：1. 空格後有主詞 the budget＋動詞 was，是句子。2. 讓步接句子用 Although。3. 選 C。"}, {"n": 8, "stem": "All employees must comply ------- the new travel policy.", "opts": ["by", "with", "to", "on"], "ans": 1, "exp": "判斷步驟：comply with ＝ 遵守。看到 comply 直接選 with。"}, {"n": 9, "stem": "The company hired a designer ------- work has won several awards.", "opts": ["who", "whose", "which", "whom"], "ans": 1, "exp": "判斷步驟：1. 空格後先出現名詞 work，再接動詞 has won。2. 「那位設計師『的』作品」。3. 選 whose。"}, {"n": 10, "stem": "Mr. Patel is responsible ------- training new employees.", "opts": ["of", "for", "with", "to"], "ans": 1, "exp": "判斷步驟：1. be responsible for ＝ 負責。2. 選 B。對照：be in charge of 用 of，別混。"}, {"n": 11, "stem": "The annual sales meeting will be held ------- December 9.", "opts": ["at", "in", "on", "by"], "ans": 2, "exp": "判斷步驟：1. 日期、星期用 on；時刻用 at；月份、年份用 in。2. December 9 是日期，選 C。"}]}, {"kind": "p7", "heading": "Part 7 短篇閱讀（建議 9 分鐘）", "tip": "先讀題目、圈關鍵字（Why、completed、Where、NOT），再回原文找那一句。注意「開始時間」「完成時間」和分機號碼都是干擾；instead of 前面是新地點。NOT 題逐一刪去原文有的。", "passage": ["E-mail", "To: All staff　From: Facilities Office　Subject: Parking Lot B Repainting", "Parking Lot B will be closed on Saturday, December 5, and Sunday, December 6, so that the lines can be repainted. Work will start at 7:00 A.M. on Saturday and should be finished by 6:00 P.M. on Sunday.", "During this time, please park in Lot D instead of Lot B. A free shuttle will run between Lot D and the main building every 15 minutes.", "If you have questions, contact Karen Wu at extension 312."], "qs": [{"n": 12, "stem": "Why was the e-mail sent?", "opts": ["To announce a new parking fee", "To explain a temporary parking change", "To introduce a new staff member", "To ask staff to work on the weekend"], "ans": 1, "exp": "判斷步驟：1. 目的題看主旨和第一句：Parking Lot B will be closed。2. 暫時改停別處 ＝ temporary parking change。3. 選 B。"}, {"n": 13, "stem": "When is the work expected to be completed?", "opts": ["Saturday at 7:00 A.M.", "Saturday at 6:00 P.M.", "Sunday at 6:00 P.M.", "Sunday at 3:12 P.M."], "ans": 2, "exp": "判斷步驟：1. should be finished by 6:00 P.M. on Sunday。2. A 是開始時間；B 把星期混搭；D 用分機 312 混淆，是數字干擾。3. 選 C。"}, {"n": 14, "stem": "Where should staff park on December 5?", "opts": ["In Lot B", "In Lot D", "In front of the main building", "On the street"], "ans": 1, "exp": "判斷步驟：1. please park in Lot D instead of Lot B。2. instead of 前面是新地點，後面是舊地點（陷阱）。3. 選 B。"}, {"n": 15, "stem": "What is NOT mentioned about the shuttle?", "opts": ["It is free.", "It runs every 15 minutes.", "It goes to the main building.", "It runs until midnight."], "ans": 3, "exp": "判斷步驟：1. NOT 題：逐一核對。2. free、every 15 minutes、main building 原文都有。3. 原文沒提到 midnight，選 D。"}]}, {"kind": "part2", "heading": "Part 2 聽力應答（建議 6 分鐘）", "tip": "先聽清楚第一個字（Why don't we／or／When／Didn't／Who／How long）。建議句不選 Because；A or B 問句和 Wh 問句不選 Yes。重複題目的字或發音相近的字（lunch／launch、call／mall）通常是陷阱。", "qs": [{"n": 16, "stem": "Why don't we order lunch for the team?", "opts": ["Because I was busy.", "That's a great idea.", "The launch was successful."], "ans": 1, "exp": "判斷步驟：1. Why don't we…? ＝ 建議「我們何不……」。2. B 接受建議。3. A 是 Because 陷阱；C 用 lunch／launch 發音相近陷阱。", "audio": "d28_16.mp3"}, {"n": 17, "stem": "Would you like the window seat or the aisle seat?", "opts": ["Yes, I would.", "The aisle, please.", "I saw it in the window."], "ans": 1, "exp": "判斷步驟：1. A or B 選擇疑問句，先刪 Yes。2. B 選走道。3. C 重複 window，是重複字陷阱。", "audio": "d28_17.mp3"}, {"n": 18, "stem": "When does the new manager start?", "opts": ["Next Monday.", "In the start menu.", "He's a good manager."], "ans": 0, "exp": "判斷步驟：1. When 問時間。2. A 回答時間。3. B 重複 start；C 重複 manager，答非所問。", "audio": "d28_18.mp3"}, {"n": 19, "stem": "Didn't you call the supplier this morning?", "opts": ["Yes, they'll deliver tomorrow.", "It's a small mall.", "I like the morning."], "ans": 0, "exp": "判斷步驟：1. 把 not 拿掉：Did you call the supplier?。2. A「有，他們明天送」。3. B 用 call／mall 發音相近陷阱；C 重複 morning。", "audio": "d28_19.mp3"}, {"n": 20, "stem": "Who approved the budget?", "opts": ["Yes, it was approved.", "The finance director did.", "About two thousand dollars."], "ans": 1, "exp": "判斷步驟：1. Who 問人。2. B 回答人。3. A 是 Yes 陷阱又重複 approve；C 回答金額（How much）。", "audio": "d28_20.mp3"}, {"n": 21, "stem": "How long will the repairs take?", "opts": ["About three days.", "It's very long.", "At the repair shop."], "ans": 0, "exp": "判斷步驟：1. How long 問多久。2. A「大約三天」。3. B 重複 long；C 回答地點（Where）又重複 repair。", "audio": "d28_21.mp3"}]}, {"kind": "talk", "heading": "Part 4 電話留言（建議 4 分鐘）", "tip": "播放前先讀三題，圈出 purpose、When delivered、asked to do。留言會出現原本時間、新時間和回電期限，選 instead 前面的新時間。最後一句通常是要聽者做的事，注意 call back ＝ return a call。", "audio": "d28_S.mp3", "script": ["Hello, this is Mark Davis from Bright Office Supplies, calling for Ms. Lopez.", "I'm calling about your order of printer paper and toner. It was supposed to arrive on Wednesday at nine A.M.", "Unfortunately, our delivery truck broke down, so we can't deliver it then.", "We can bring it on Thursday at three P.M. instead.", "If that time doesn't work for you, please call me back at 555-0127 before five o'clock today."], "qs": [{"n": 22, "stem": "What is the purpose of the message?", "opts": ["To change a delivery time", "To advertise a sale", "To request a payment", "To cancel an order"], "ans": 0, "exp": "判斷步驟：1. 目的題聽前兩三句：calling about your order…can't deliver it then。2. 改送貨時間 ＝ change a delivery time。3. 選 A。"}, {"n": 23, "stem": "When will the order most likely be delivered?", "opts": ["Wednesday at 9 A.M.", "Wednesday at 3 P.M.", "Thursday at 3 P.M.", "Thursday at 5 P.M."], "ans": 2, "exp": "判斷步驟：1. We can bring it on Thursday at three P.M. instead。2. A 是原本時間；B 新舊混搭；D 用回電期限 5 點混淆。3. 選 C。"}, {"n": 24, "stem": "What is the listener asked to do if the time is not convenient?", "opts": ["Visit the store", "Return a call", "Send an e-mail", "Pay a fee"], "ans": 1, "exp": "判斷步驟：1. please call me back。2. call back ＝ return a call（換句話說）。3. 選 B。"}]}]};</script><script src="app.js"></script></body></html>
