<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 每日練習 Day 3（2026-10-31）</title><link rel="stylesheet" href="style.css"></head><body><main></main><script>window.DAY={"day": 3, "date": "2026-10-31", "title": "TOEIC 每日練習 Day 3（2026-10-31）", "summary": "今天首次加入 Part 4 單人獨白，文法重點是詞性（副詞）、主詞動詞一致、情緒形容詞 V-ing / p.p.、by 與 until。點選答案立即看對錯與解析，做完把分數回報到聊天室。", "sections": [{"kind": "p5", "heading": "Part 5 文法與字彙（建議 11 分鐘）", "tip": "作答技巧：遇到詞性題，先找句子的主詞和動詞。如果動詞已經完整，空格多半是修飾用的副詞或形容詞。", "qs": [{"n": 1, "stem": "The manager spoke ------- about the success of the new project.", "opts": ["confident", "confidence", "confidently", "confidential"], "ans": 2, "exp": "空格修飾動詞 spoke（怎麼說），要用副詞 confidently（有自信地）。confident 是形容詞；confidence 是名詞；confidential 是「機密的」，字形相近是陷阱。"}, {"n": 2, "stem": "Each of the employees ------- a parking permit.", "opts": ["have", "has", "having", "are having"], "ans": 1, "exp": "主詞是 Each（每一個），視為單數，動詞用 has。of the employees 只是修飾語，不要被複數 employees 騙到。同類：Every、One of the ...、Neither of ... 都接單數動詞。"}, {"n": 3, "stem": "The results of the product test were very -------.", "opts": ["disappoint", "disappointed", "disappointing", "disappointment"], "ans": 2, "exp": "主詞是「結果」這個事物，事物「令人失望」用 V-ing：disappointing。人「感到失望」才用 p.p.：I was disappointed。同類：interesting / interested、satisfying / satisfied。"}, {"n": 4, "stem": "Please submit your expense report ------- Friday.", "opts": ["until", "by", "since", "during"], "ans": 1, "exp": "by + 時間 = 「在某時間之前（完成）」，搭配 submit 這種一次完成的動作。until 是「持續到某時」，搭配 stay、wait 這類持續動作。since 要搭配完成式；during 接一段期間。"}, {"n": 5, "stem": "------- you have any questions, please contact our help desk.", "opts": ["If", "Unless", "Whether", "Despite"], "ans": 0, "exp": "「如果有問題，請聯絡服務台」用 If。Unless = if not，語意相反；Whether 表示「是否」，通常搭配 or not；Despite 是介系詞，後面不能接子句。"}, {"n": 6, "stem": "The new printer is ------- than the old one.", "opts": ["fast", "faster", "fastest", "more fast"], "ans": 1, "exp": "看到 than 就用比較級。fast 是單音節，比較級是 faster，不是 more fast。fastest 是最高級，要搭配 the。"}, {"n": 7, "stem": "Ms. Chen is responsible ------- training new staff members.", "opts": ["for", "to", "with", "of"], "ans": 0, "exp": "固定搭配 be responsible for + N / V-ing（負責某事）。注意 for 是介系詞，後面接 training（V-ing）。be responsible to 是「對某人負責」，語意不同。"}, {"n": 8, "stem": "The conference room is unavailable ------- it is being renovated.", "opts": ["because", "because of", "due to", "so"], "ans": 0, "exp": "空格後面是完整子句（it is being renovated），要用連接詞 because。because of、due to 是介系詞片語，只能接名詞（because of the renovation）。so 表示結果，因果方向相反。"}, {"n": 9, "stem": "Our online sales have increased ------- since last year.", "opts": ["significant", "significance", "significantly", "signify"], "ans": 2, "exp": "have increased 已經是完整動詞，後面修飾動詞要用副詞 significantly（顯著地）。TOEIC 常見組合：increase / decrease / improve + significantly / dramatically / steadily。"}, {"n": 10, "stem": "The factory in Tainan ------- more than 500 workers.", "opts": ["employ", "employs", "employment", "employing"], "ans": 1, "exp": "句子缺主要動詞，主詞 The factory 是第三人稱單數，用 employs。in Tainan 是修飾語，不影響動詞。employment 是名詞；employing 不能單獨當主要動詞。"}, {"n": 11, "stem": "Customers may ------- a full refund within 30 days of purchase.", "opts": ["request", "require", "remind", "reply"], "ans": 0, "exp": "request a refund（要求退款）是固定搭配。require 是「規定、需要」；remind 是「提醒某人」，要接人；reply 是不及物動詞，要用 reply to。"}]}, {"kind": "p7", "heading": "Part 7 短篇閱讀（建議 9 分鐘）", "tip": "公告類文章：主旨通常在第一句，日期、時間、分機號碼常被拿來設計數字陷阱。", "passage": ["NOTICE TO ALL TENANTS", "Harbor Tower Building Management", "", "The elevators in the east wing will be closed for maintenance from Monday, November 9, to Wednesday, November 11. During this period, please use the elevators in the west wing.", "The freight elevator will remain available for deliveries. However, it must be reserved at least one day in advance through the management office.", "We apologize for any inconvenience. If you have any questions, please call the management office at extension 210 between 9 A.M. and 5 P.M."], "qs": [{"n": 12, "stem": "What is the purpose of the notice?", "opts": ["To announce a temporary closure", "To introduce new tenants", "To explain a delivery policy change", "To advertise office space"], "ans": 0, "exp": "主旨題：第一段就說東側電梯 will be closed for maintenance，是暫時停用的公告。delivery 雖有出現，但只是補充說明，不是主旨。"}, {"n": 13, "stem": "How long will the east wing elevators be closed?", "opts": ["One day", "Two days", "Three days", "One week"], "ans": 2, "exp": "推算題：from Monday, November 9, to Wednesday, November 11，週一、週二、週三共 3 天。注意 from ... to ... 包含頭尾兩天。"}, {"n": 14, "stem": "What must tenants do to use the freight elevator?", "opts": ["Pay a fee", "Reserve it in advance", "Use it after 5 P.M.", "Show an ID card"], "ans": 1, "exp": "細節題：it must be reserved at least one day in advance = Reserve it in advance。5 P.M. 是辦公室電話的服務時間，是數字陷阱。"}, {"n": 15, "stem": "The word “remain” in paragraph 2 is closest in meaning to", "opts": ["stay", "leave", "return", "change"], "ans": 0, "exp": "同義字題：remain available = stay available（維持可用）。remain、stay 後面都可以直接接形容詞，例如 remain open、stay calm。"}]}, {"kind": "part2", "heading": "Part 2 聽力應答（建議 6 分鐘）", "tip": "按播放鍵聽題目和 A、B、C 三個回應，再點選答案。抓住句首疑問詞（When、Who、Which），並小心「重複字」和「發音相近字」的陷阱。", "qs": [{"n": 16, "stem": "When does the next train to Taipei leave?", "opts": ["At three fifteen.", "From platform two.", "Yes, I'm leaving soon."], "ans": 0, "exp": "When 問時間 → At three fifteen。B 回答的是地點（Where）；C 用 Yes 回答 Wh 問句，又重複 leave，是雙重陷阱。", "audio": "d3_16.mp3"}, {"n": 17, "stem": "Who is in charge of the budget?", "opts": ["It's too expensive.", "Ms. Wang in Accounting.", "I need to charge my phone."], "ans": 1, "exp": "Who 問人 → Ms. Wang in Accounting（會計部的王小姐）。A 跟 budget 相關聯想但沒回答誰；C 重複 charge，意思是「充電」，是同音異義陷阱。", "audio": "d3_17.mp3"}, {"n": 18, "stem": "Could you send me the meeting notes?", "opts": ["Sure, I'll e-mail them right now.", "It was a long meeting.", "He sent it yesterday."], "ans": 0, "exp": "Could you ...? 是請求，回答答應或拒絕 → Sure。B 重複 meeting；C 重複 send 的過去式 sent，而且主詞 He 對不上。", "audio": "d3_18.mp3"}, {"n": 19, "stem": "Isn't the store open on Sundays?", "opts": ["The store sells shoes.", "Please open the window.", "No, it's closed on weekends."], "ans": 2, "exp": "否定疑問句（Isn't ...?）照一般問句回答即可：店沒開就答 No → closed on weekends。A 重複 store；B 重複 open，都是聽到相同字就選的陷阱。", "audio": "d3_19.mp3"}, {"n": 20, "stem": "Which supplier did you choose?", "opts": ["Yes, I chose it.", "The one in Taichung. Their prices are lower.", "We need more supplies."], "ans": 1, "exp": "Which 問哪一個 → The one in Taichung。A 用 Yes 回答 Wh 問句；C 的 supplies 與 supplier 字形相近，是發音陷阱。", "audio": "d3_20.mp3"}]}, {"kind": "talk", "heading": "Part 4 單人獨白（建議 4 分鐘）", "tip": "Part 4 是一個人說話，例如電話留言、廣播。正式考試題目會印在題本上，所以先讀兩題題目，再按播放。身分題看開頭，要求題看結尾的 Please。", "audio": "d3_S.mp3", "script": ["Hello, this is Linda calling from Rapid Auto Repair. We've finished replacing the brakes on your car.", "However, we noticed that one of your tires is badly worn. We can replace it today for two thousand five hundred dollars.", "Please call me back before four P.M. so that we can finish the work today. Thank you."], "qs": [{"n": 21, "stem": "Where does the speaker most likely work?", "opts": ["At a car repair shop", "At a bank", "At a train station", "At a tire factory"], "ans": 0, "exp": "Part 4 說話者身分題，答案通常在開頭自我介紹：calling from Rapid Auto Repair，再加上 brakes、car 等關鍵字，就是修車廠。tire 有出現，但 tire factory 是重複字陷阱。"}, {"n": 22, "stem": "What does the speaker ask the listener to do?", "opts": ["Pick up the car tomorrow", "Pay by credit card", "Return the call by a certain time", "Buy new brakes"], "ans": 2, "exp": "要求題答案常在後段的 Please ...：Please call me back before four P.M. = Return the call by a certain time。煞車已經換好了，所以 D 不對。"}]}]};</script><script src="app.js"></script></body></html>
