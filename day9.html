<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 每日練習 Day 9（2026-11-06）</title><link rel="stylesheet" href="style.css"></head><body><main></main><script>window.TOPIC="toeic-031049f6a9e969e4a473d8ce451b3275";window.DAY={"day": 9, "date": "2026-11-06", "title": "TOEIC 每日練習 Day 9（2026-11-06）", "summary": "今天的專項是「動詞＋受詞＋形容詞」（keep／find／make + object + adjective），Part 5 前 6 題只練這個句型，再加 whose／who 對照與 comply with；後面複習假設語氣與 because of。聽力改回 Part 4 電話留言。做完按「交卷」就會自動回傳成績；Day 7、Day 8 若還沒交卷，也請一起做完交卷。", "sections": [{"kind": "p5", "heading": "Part 5 文法與字彙（建議 11 分鐘）", "tip": "keep／find／make + 受詞 + 形容詞：空格描述受詞的「狀態」，一律選形容詞，不要選副詞（-ly）或名詞。whose 後面接名詞，who 後面接動詞。", "qs": [{"n": 1, "stem": "Please keep the laboratory door ------- after 6 P.M.", "opts": ["close", "closed", "closely", "closing"], "ans": 1, "exp": "判斷步驟：1. keep + 受詞（the laboratory door）+ 空格。2. 空格描述門的「狀態」，用形容詞（或過去分詞當形容詞）。3. 選 closed。closely 是副詞，不能放在受詞後描述狀態。"}, {"n": 2, "stem": "Many students find online registration ------- to complete.", "opts": ["easy", "easily", "ease", "easier"], "ans": 0, "exp": "判斷步驟：1. find + 受詞（online registration）+ 空格。2. 空格描述註冊系統的狀態（容易完成），用形容詞。3. 選 easy。easily 是副詞；ease 是名詞。"}, {"n": 3, "stem": "The new software will make the design process -------.", "opts": ["simple", "simply", "simplify", "simplicity"], "ans": 0, "exp": "判斷步驟：1. make + 受詞（the design process）+ 空格。2. 空格描述流程變得怎樣，用形容詞。3. 選 simple。simply 是副詞；simplify 是動詞。"}, {"n": 4, "stem": "Please keep all emergency exits ------- at all times.", "opts": ["clear", "clearly", "clearness", "cleared"], "ans": 0, "exp": "判斷步驟：1. keep + 受詞（all emergency exits）+ 空格。2. 描述出口的狀態＝形容詞。3. 選 clear。clearly 是副詞。"}, {"n": 5, "stem": "Customers found the new website ------- to navigate.", "opts": ["difficult", "difficulty", "difficultly", "difficulties"], "ans": 0, "exp": "判斷步驟：1. find + 受詞（the new website）+ 空格。2. 描述網站狀態，用形容詞。3. 選 difficult。difficulty／difficulties 是名詞。"}, {"n": 6, "stem": "The manager wants to make the weekly reports -------.", "opts": ["shorter", "shortly", "shorten", "shortness"], "ans": 0, "exp": "判斷步驟：1. make + 受詞（the weekly reports）+ 空格。2. 描述報告變得怎樣，用形容詞（比較級也可）。3. 選 shorter。shortly 是副詞；shorten 是動詞。"}, {"n": 7, "stem": "We need a technician ------- experience includes solar panels.", "opts": ["who", "whose", "whom", "which"], "ans": 1, "exp": "判斷步驟：1. 空格後直接接名詞 experience，再接動詞 includes。2. 「技術人員『的』經驗」。3. 選 whose。who 後面要接動詞。"}, {"n": 8, "stem": "We need a technician ------- can install solar panels.", "opts": ["whose", "who", "whom", "which"], "ans": 1, "exp": "判斷步驟：1. 空格後直接接動詞 can install。2. 缺主詞，先行詞是人（technician）。3. 選 who。和上一題對照：whose + 名詞、who + 動詞。"}, {"n": 9, "stem": "The company hired an engineer ------- ideas improved the product.", "opts": ["who", "whose", "whom", "which"], "ans": 1, "exp": "判斷步驟：1. 空格後是名詞 ideas，再接動詞 improved。2. 「工程師『的』想法」。3. 選 whose。看到「空格＋名詞＋動詞」幾乎都是 whose。"}, {"n": 10, "stem": "All visitors must comply ------- the building security rules.", "opts": ["to", "with", "for", "by"], "ans": 1, "exp": "判斷步驟：comply with ＝ 遵守，固定搭配。選 with。請大聲念：comply with the rules。"}, {"n": 11, "stem": "If the client ------- the contract yesterday, we would have started the project.", "opts": ["signs", "signed", "had signed", "has signed"], "ans": 2, "exp": "判斷步驟：1. 看到 yesterday 和 would have started ＝ 與過去相反。2. if 子句用 had + p.p.。3. 選 had signed。公式：If + had + p.p., would have + p.p.。"}, {"n": 12, "stem": "The outdoor event was canceled ------- strong winds.", "opts": ["because", "because of", "although", "while"], "ans": 1, "exp": "判斷步驟：1. 空格後 strong winds，沒有動詞。2. 沒動詞＝介系詞。3. 選 because of。because 要接子句（有動詞）。"}]}, {"kind": "p7", "heading": "Part 7 短篇閱讀（建議 9 分鐘）", "tip": "先讀題目、圈關鍵字（GreenFit、yoga、NOT、reopen），再回原文找那一句。換句話說題找同義說法（show staff ID＝showing a staff ID card）。", "passage": ["NOTICE: Staff Fitness Center", "", "The staff fitness center on the second floor will be closed for renovation from Monday, November 9, through Friday, November 13.", "During this period, employees may use the partner gym at GreenFit Studio on Maple Street free of charge. Please show your staff ID card at the front desk.", "Yoga classes usually held in the fitness center will move to Conference Room B on the third floor at the same times.", "The fitness center is expected to reopen on Monday, November 16. We apologize for any inconvenience."], "qs": [{"n": 13, "stem": "What is the notice mainly about?", "opts": ["A new yoga teacher", "A temporary fitness center closure", "A change in staff ID rules", "A sale at GreenFit Studio"], "ans": 1, "exp": "判斷步驟：1. 看標題 Staff Fitness Center 和第一句 will be closed for renovation。2. 關一週 ＝ temporary closure。3. 選 B。"}, {"n": 14, "stem": "How can employees use GreenFit Studio?", "opts": ["By paying a weekly fee", "By showing a staff ID card", "By booking online", "By calling Maple Street"], "ans": 1, "exp": "判斷步驟：1. 找 GreenFit：Please show your staff ID card at the front desk。2. show your staff ID ＝ 換句話說 showing a staff ID card。3. 選 B。原文說 free of charge，A 是陷阱。"}, {"n": 15, "stem": "Where will yoga classes be held during the renovation?", "opts": ["At GreenFit Studio", "In the second-floor gym", "In Conference Room B", "On Maple Street"], "ans": 2, "exp": "判斷步驟：1. 找 yoga classes：will move to Conference Room B on the third floor。2. 選 C。GreenFit 是給一般健身用的，不是瑜珈課地點。"}, {"n": 16, "stem": "What is NOT mentioned in the notice?", "opts": ["When the fitness center will reopen", "Where the partner gym is", "The cost of the renovation", "Where yoga classes will move"], "ans": 2, "exp": "判斷步驟：NOT 題逐一回原文打勾。A：Monday, November 16，有。B：Maple Street，有。D：Conference Room B，有。C：裝修費用完全沒提，選 C。"}]}, {"kind": "part2", "heading": "Part 2 聽力應答（建議 6 分鐘）", "tip": "Didn't／Isn't 開頭的否定疑問句，把 not 拿掉再理解；Why don't you／we 是建議，刪掉 Because；聽到 or 就刪掉 Yes 開頭的選項。", "qs": [{"n": 17, "stem": "Didn't you reserve a meeting room for tomorrow?", "opts": ["Yes, I booked Room 3.", "It's a large reservation.", "Meet me at the door."], "ans": 0, "exp": "判斷步驟：1. 把 not 拿掉：Did you reserve a meeting room for tomorrow?。2. A「有，訂了 Room 3」，對應。3. B 重複 reservation；C 重複 meet／meeting。", "audio": "d9_17.mp3"}, {"n": 18, "stem": "Isn't the copy machine working today?", "opts": ["No, it's out of paper.", "I like working late.", "At the copy shop."], "ans": 0, "exp": "判斷步驟：1. 當成 Is the copy machine working today?。2. A「沒紙了」，對應。3. B 重複 working；C 用 copy shop 字形／字義陷阱。", "audio": "d9_18.mp3"}, {"n": 19, "stem": "Why don't we finish the report before lunch?", "opts": ["Because lunch is ready.", "Good idea. Let's start now.", "At twelve o'clock."], "ans": 1, "exp": "判斷步驟：1. Why don't we…? ＝ 提議「我們要不要……」。2. 回應提議：Good idea. Let's start now。3. 先刪 Because 開頭的 A。", "audio": "d9_19.mp3"}, {"n": 20, "stem": "Why don't you ask the IT desk for help?", "opts": ["OK, I'll go there now.", "Because IT helped me.", "It's a helpful desk."], "ans": 0, "exp": "判斷步驟：1. Why don't you…? 是建議。2. OK, I'll go there now ＝ 接受建議。3. B 有 Because，刪；C 重複 help／desk，刪。", "audio": "d9_20.mp3"}, {"n": 21, "stem": "Should we take the bus or the subway?", "opts": ["Yes, we should.", "The subway is faster.", "At eight fifteen."], "ans": 1, "exp": "判斷步驟：1. 聽到 or ＝ 選擇疑問句，先刪 Yes 開頭的 A。2. The subway is faster ＝ 選地鐵（間接選擇）。3. C 回答時間，不是交通工具。", "audio": "d9_21.mp3"}, {"n": 22, "stem": "Would you prefer a morning or afternoon flight?", "opts": ["Yes, please.", "Afternoon, if possible.", "At the airport."], "ans": 1, "exp": "判斷步驟：1. 有 or，先刪 Yes。2. Afternoon, if possible ＝ 選下午。3. C 回答地點，不對。", "audio": "d9_22.mp3"}]}, {"kind": "talk", "heading": "Part 4 電話留言（建議 4 分鐘）", "tip": "播放前先讀三題，圈出 why、when、Friday。聽到 Unfortunately、If… 這類轉折／條件句時特別注意，後面通常就是答案。", "audio": "d9_S.mp3", "script": ["Hello, this is Mark Chen from City Logistics, calling for Ms. Paula Reed.", "I'm calling about your delivery scheduled for tomorrow morning.", "Unfortunately, our truck has a mechanical problem, so we need to move your delivery to Friday afternoon between two and four P.M.", "If Friday does not work for you, please call us back at 555-0391 before noon tomorrow so we can arrange another day.", "Thank you, and we apologize for the change."], "qs": [{"n": 23, "stem": "Why is the man calling?", "opts": ["To confirm a job interview", "To change a delivery time", "To sell a new truck", "To ask for a refund"], "ans": 1, "exp": "判斷步驟：1. 目的題聽開頭：I'm calling about your delivery… we need to move your delivery。2. move the delivery ＝ change a delivery time。3. 選 B。A、C 原文沒提。"}, {"n": 24, "stem": "When will the delivery arrive if the listener accepts the change?", "opts": ["Tomorrow morning", "Friday afternoon", "Friday morning", "Saturday at noon"], "ans": 1, "exp": "判斷步驟：1. 聽 move your delivery to Friday afternoon between two and four P.M.。2. 選 B。A 是原本時間，是陷阱。"}, {"n": 25, "stem": "What should the listener do if Friday does not work?", "opts": ["Send an e-mail", "Call back before noon tomorrow", "Wait at the office all day", "Pick up the package herself"], "ans": 1, "exp": "判斷步驟：1. 找 If Friday does not work：please call us back… before noon tomorrow。2. 選 B。noon 是回電截止時間，不是取件時間。"}]}]};</script><script src="app.js"></script></body></html>
