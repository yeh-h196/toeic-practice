<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 每日練習 Day 13（2026-11-10）</title><link rel="stylesheet" href="style.css"></head><body><main></main><script>window.TOPIC="toeic-031049f6a9e969e4a473d8ce451b3275";window.DAY={"day": 13, "date": "2026-11-10", "title": "TOEIC 每日練習 Day 13（2026-11-10）", "summary": "Day 12 拿到 21/25，是目前最高分。今天針對 Day 12 錯的四個地方加強：if 子句配 will 要用現在式（3 題，加 1 題 would 對照）、keep／find + 受詞 + 形容詞（2 題）、Please 和祈使句用動詞原形（2 題），以及聽力「說話者接下來要做什麼」（聽 I'll 那句）。新搭配 be responsible for。做完按「交卷」就會自動回傳成績。", "sections": [{"kind": "p5", "heading": "Part 5 文法與字彙（建議 11 分鐘）", "tip": "假設語氣先看主要子句：will／can＝if 用現在式（第三人稱加 s）；would + 原形＝if 用過去式。keep／find／make + 受詞 + 形容詞（不用 -ly）。Please 或句首空格的祈使句用原形。空格後有主詞＋動詞選連接詞，只有名詞選介系詞。", "qs": [{"n": 1, "stem": "If the weather ------- good this weekend, we will hold the company picnic in the park.", "opts": ["were", "is", "will be", "had been"], "ans": 1, "exp": "判斷步驟：1. 先看主要子句 will hold ＝ 未來真實可能發生。2. if 子句用現在式，不能用 will、也不能用 were。3. 選 is。Day 12 的 Q1 誤選 were：were 只配 would／could，看到 will 就用現在式。"}, {"n": 2, "stem": "We will send you a free sample if you ------- the online form by Friday.", "opts": ["completed", "would complete", "complete", "had completed"], "ans": 2, "exp": "判斷步驟：1. 主要子句 will send ＝ 真實條件。2. if 子句用現在式，主詞 you 配原形 complete。3. 選 complete。if 子句放在後面也一樣，先找 will。"}, {"n": 3, "stem": "If Mr. Ito ------- the report by noon, he will e-mail it to the whole team.", "opts": ["finishes", "finished", "will finish", "would finish"], "ans": 0, "exp": "判斷步驟：1. 主要子句 will e-mail ＝ 真實條件。2. if 子句用現在式，主詞 Mr. Ito 是第三人稱單數，加 -es。3. 選 finishes。if 子句裡不放 will。"}, {"n": 4, "stem": "If the store had more parking spaces, it ------- more customers.", "opts": ["will attract", "attracts", "would attract", "has attracted"], "ans": 2, "exp": "判斷步驟：1. if 子句 had ＝ 過去式，表示與現在事實相反（現在停車位不夠）。2. 主要子句用 would + 原形。3. 選 would attract。和前三題對照：if 用過去式才配 would。"}, {"n": 5, "stem": "The new heating system keeps the office ------- even in January.", "opts": ["warmly", "warmth", "warm", "warming"], "ans": 2, "exp": "判斷步驟：1. keep + 受詞（the office）+ 空格。2. 空格描述辦公室的狀態，用形容詞。3. 選 warm。Day 12 的 Q10 誤選副詞 reliably：受詞後面描述狀態要用形容詞，不用 -ly。"}, {"n": 6, "stem": "Many users find the new app very ------- to use.", "opts": ["easily", "easy", "ease", "eased"], "ans": 1, "exp": "判斷步驟：1. find + 受詞（the new app）+ very + 空格。2. 說明 app 的狀態「很容易」，用形容詞。3. 選 easy。very 後面接形容詞，不是 easily。"}, {"n": 7, "stem": "Please ------- your name and employee number on the sign-in sheet.", "opts": ["writing", "to write", "wrote", "write"], "ans": 3, "exp": "判斷步驟：1. Please 後面是祈使句，動詞用原形。2. 選 write。Day 12 的 Q11 誤選過去分詞 ensured：Please 後面不接 -ed、-ing、to。"}, {"n": 8, "stem": "------- the main entrance until the construction work is completed.", "opts": ["Avoid", "Avoiding", "Avoided", "To avoiding"], "ans": 0, "exp": "判斷步驟：1. 句子開頭就是空格，後面沒有主詞，是祈使句（命令、請求）。2. 祈使句用動詞原形。3. 選 Avoid。"}, {"n": 9, "stem": "We hired a designer ------- work has won several international awards.", "opts": ["who", "which", "whose", "whom"], "ans": 2, "exp": "判斷步驟：1. 空格後是名詞 work，再接動詞 has won。2. 「設計師『的』作品」。3. 選 whose。口訣：whose + 名詞、who + 動詞。"}, {"n": 10, "stem": "------- the meeting ran late, Ms. Garcia still caught her flight.", "opts": ["Despite", "Although", "During", "Because of"], "ans": 1, "exp": "判斷步驟：1. 空格後 the meeting ran late 有主詞＋動詞，是完整子句。2. 子句前用連接詞，Despite、During、Because of 都是介系詞。3. 語意「雖然」，選 Although。"}, {"n": 11, "stem": "The hotel offers a free shuttle ------- to and from the airport.", "opts": ["service", "served", "serving", "servant"], "ans": 0, "exp": "判斷步驟：1. 冠詞 a + 形容詞 free + shuttle + 空格，需要名詞。2. shuttle service ＝ 接駁服務，多益常見搭配。3. 選 service。servant 是「僕人」，語意不對。"}, {"n": 12, "stem": "Mr. Kim is responsible ------- training all new sales staff.", "opts": ["to", "with", "for", "of"], "ans": 2, "exp": "判斷步驟：be responsible for ＝ 負責……，固定搭配，選 for。新搭配請記下來，和 comply with 一樣是直接背的介系詞題。"}]}, {"kind": "p7", "heading": "Part 7 短篇閱讀（建議 9 分鐘）", "tip": "先讀題目、圈關鍵字（why closed、Hillside、November 1、NOT），再回原文找那一句。注意兩個日期不要看混。NOT 題四個選項都要回原文打勾。", "passage": ["Riverside Fitness Center", "Notice to All Members", "", "Starting Monday, December 1, the swimming pool will be closed for two weeks so that new lights can be installed. The gym and the yoga rooms will stay open as usual.", "During this time, members may use the pool at our Hillside location for free. Please show your membership card at the front desk.", "We will also add one free month to the membership of anyone who joined before November 1. If you have questions, please speak to any staff member."], "qs": [{"n": 13, "stem": "Why will the pool be closed?", "opts": ["It needs to be cleaned.", "New lights will be installed.", "The water heater is broken.", "It will be made larger."], "ans": 1, "exp": "判斷步驟：1. 題目問原因，找 closed 那句：so that new lights can be installed。2. 選 B。so that 後面就是目的或原因。"}, {"n": 14, "stem": "What should members do to use the Hillside pool?", "opts": ["Pay a small fee", "Call ahead", "Show their membership card", "Sign up online"], "ans": 2, "exp": "判斷步驟：1. 找 Hillside 那段：Please show your membership card at the front desk。2. 選 C。A 是陷阱：原文說 for free（免費）。"}, {"n": 15, "stem": "What will members who joined before November 1 receive?", "opts": ["A free month", "A new membership card", "Free yoga classes", "A discount at the Hillside location"], "ans": 0, "exp": "判斷步驟：1. 找 joined before November 1：add one free month to the membership。2. 選 A。注意日期：November 1 是入會日期，December 1 是關閉日期，別看混。"}, {"n": 16, "stem": "What is NOT mentioned in the notice?", "opts": ["How long the pool will be closed", "Which facilities will remain open", "The opening hours of the Hillside location", "Who to ask for more information"], "ans": 2, "exp": "判斷步驟：NOT 題逐一回原文打勾。A：for two weeks，有。B：gym and yoga rooms，有。D：speak to any staff member，有。C：Hillside 的營業時間沒提，選 C。"}]}, {"kind": "part2", "heading": "Part 2 聽力應答（建議 6 分鐘）", "tip": "先聽清楚第一個字（Who／When／Where／Why don't），刪掉發音相同或重複字的選項。聽到 or 就刪 Yes。I'll… 這種間接回答也常是正解。", "qs": [{"n": 17, "stem": "Didn't you order more paper for the copier?", "opts": ["Yes, it'll arrive tomorrow.", "The copier is on the second floor.", "In alphabetical order."], "ans": 0, "exp": "判斷步驟：1. 把 not 拿掉：Did you order more paper?。2. A「有，明天會到」，對應。3. B 重複 copier；C 用 order（順序）的同字異義陷阱。", "audio": "d13_17.mp3"}, {"n": 18, "stem": "Why don't we ask the client for more time?", "opts": ["Because it was late.", "That's a good idea.", "Three hours ago."], "ans": 1, "exp": "判斷步驟：1. Why don't we…? ＝ 提議。2. That's a good idea ＝ 接受。3. A 是 Because 開頭陷阱；C 用 time 聯想到時間。", "audio": "d13_18.mp3"}, {"n": 19, "stem": "Should I call the supplier or send an e-mail?", "opts": ["E-mail would be faster.", "Yes, I called them.", "The supplier is in Osaka."], "ans": 0, "exp": "判斷步驟：1. 有 or，先刪 Yes 開頭的 B。2. A 選了其中一個：e-mail。3. C 重複 supplier。", "audio": "d13_19.mp3"}, {"n": 20, "stem": "Who's in charge of the new project?", "opts": ["It's free of charge.", "Ms. Lopez is leading it.", "A new projector."], "ans": 1, "exp": "判斷步驟：1. Who 問人，答案要有人名或職稱。2. B「Lopez 女士負責」。3. A 用 charge 同字異義陷阱；C 用 project／projector 發音陷阱。", "audio": "d13_20.mp3"}, {"n": 21, "stem": "When will the new manager start?", "opts": ["At the start of next month.", "In the manager's office.", "He started the car."], "ans": 0, "exp": "判斷步驟：1. When 問時間。2. A「下個月初」。3. B 是地點，回答 Where；C 重複 start。", "audio": "d13_21.mp3"}, {"n": 22, "stem": "Where can I find the meeting agenda?", "opts": ["Around 3 o'clock.", "I'll e-mail it to you now.", "We met last week."], "ans": 1, "exp": "判斷步驟：1. Where 問地點，但正解不一定直接講地點。2. B「我現在寄給你」，間接解決問題，多益常見。3. A 是時間；C 用 meeting／met 陷阱。", "audio": "d13_22.mp3"}]}, {"kind": "talk", "heading": "Part 3 兩人對話（建議 4 分鐘）", "tip": "播放前先讀三題，圈出 problem、Room C、do next。最後一題聽男生的 I'll… 那一句，答案就是 I'll 後面的動詞。", "audio": "d13_S.mp3", "script": ["Woman: Hi Tom, the projector in Meeting Room B isn't working. I have a presentation for the sales team at two o'clock.", "Man: Oh no. The technician won't be here until tomorrow. But Meeting Room C has a projector that works well.", "Woman: Room C is a bit small, though. About fifteen people are coming.", "Man: Then how about the training room on the fifth floor? It's free this afternoon. I'll book it for you right now and send everyone an e-mail about the room change."], "qs": [{"n": 23, "stem": "What problem does the woman mention?", "opts": ["A room is too small.", "A projector is not working.", "A presentation was canceled.", "The sales team is late."], "ans": 1, "exp": "判斷步驟：1. 問題題聽女生第一句：the projector in Meeting Room B isn't working。2. 選 B。A 是陷阱：too small 是在講 Room C，不是她一開始的問題。"}, {"n": 24, "stem": "Why does the woman not want to use Meeting Room C?", "opts": ["It is being repaired.", "It is already booked.", "It is too small.", "It has no projector."], "ans": 2, "exp": "判斷步驟：1. 聽女生第二句：Room C is a bit small。2. 選 C。D 是陷阱：男生說 Room C 的投影機很好用。"}, {"n": 25, "stem": "What will the man do next?", "opts": ["Repair the projector", "Call the technician", "Book the training room", "Give the presentation"], "ans": 2, "exp": "判斷步驟：1. 下一步動作題，聽男生 I'll…：I'll book it for you right now（it ＝ the training room）。2. 選 C。B 是陷阱：技師明天才來，他沒說要打電話。Day 8、Day 12 的 Q25 都錯這類題，答案就在 I'll 後面的動詞。"}]}]};</script><script src="app.js"></script></body></html>
