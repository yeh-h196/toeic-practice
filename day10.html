<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 每日練習 Day 10（2026-11-07）</title><link rel="stylesheet" href="style.css"></head><body><main></main><script>window.TOPIC="toeic-031049f6a9e969e4a473d8ce451b3275";window.DAY={"day": 10, "date": "2026-11-07", "title": "TOEIC 每日練習 Day 10（2026-11-07）", "summary": "今天是 Day 7–9 三個專項的綜合複習：連接詞與介系詞、假設語氣、keep／find／make + 受詞 + 形容詞，再加 whose／who 和 comply with。每題都附判斷步驟，先照步驟判斷再選。聽力是 Part 2 加一段 Part 3 兩人對話。做完按「交卷」就會自動回傳成績；Day 7–9 還沒交卷，有空也請補做交卷。", "sections": [{"kind": "p5", "heading": "Part 5 文法與字彙（建議 11 分鐘）", "tip": "先看空格後面：有主詞＋動詞選連接詞，只有名詞選介系詞；假設語氣先看主要子句的時態；keep／find／make + 受詞後面選形容詞；whose + 名詞、who + 動詞。", "qs": [{"n": 1, "stem": "The flight was delayed ------- heavy snow at the airport.", "opts": ["because", "because of", "although", "while"], "ans": 1, "exp": "判斷步驟：1. 空格後 heavy snow，是名詞片語，沒有動詞。2. 沒動詞＝介系詞。3. 選 because of。because 後面要接「主詞＋動詞」。"}, {"n": 2, "stem": "------- the price was high, many customers bought the new phone.", "opts": ["Despite", "Although", "During", "Because of"], "ans": 1, "exp": "判斷步驟：1. 空格後 the price was high，有主詞 the price 和動詞 was。2. 有動詞＝連接詞，刪掉 Despite、During、Because of（都是介系詞）。3. 意思是「雖然很貴」，選 Although。"}, {"n": 3, "stem": "Please do not use your phone ------- the presentation.", "opts": ["while", "during", "although", "because"], "ans": 1, "exp": "判斷步驟：1. 空格後 the presentation，沒有動詞。2. 沒動詞＝介系詞，選 during。while 是連接詞，後面要接子句，例如 while you are presenting。"}, {"n": 4, "stem": "If I ------- you, I would accept the job offer.", "opts": ["am", "was being", "were", "have been"], "ans": 2, "exp": "判斷步驟：1. 主要子句 would accept ＝ 與現在事實相反。2. if 子句用過去式，be 動詞一律用 were。3. 選 were。公式：If I were you, I would…"}, {"n": 5, "stem": "If we had left earlier, we ------- the train.", "opts": ["will catch", "would catch", "would have caught", "catch"], "ans": 2, "exp": "判斷步驟：1. if 子句 had left ＝ 與過去事實相反。2. 主要子句用 would have + p.p.。3. 選 would have caught。"}, {"n": 6, "stem": "If it ------- tomorrow, the picnic will be moved indoors.", "opts": ["rains", "rained", "had rained", "would rain"], "ans": 0, "exp": "判斷步驟：1. 主要子句 will be moved ＝ 真實可能發生的未來。2. if 子句用現在式。3. 選 rains。不要看到 if 就選過去式，要先看主要子句。"}, {"n": 7, "stem": "The new chairs make the waiting room more -------.", "opts": ["comfort", "comfortable", "comfortably", "comforting to"], "ans": 1, "exp": "判斷步驟：1. make + 受詞（the waiting room）+ more + 空格。2. 描述房間的狀態，用形容詞。3. 選 comfortable。comfortably 是副詞；comfort 是名詞。"}, {"n": 8, "stem": "Please keep your password ------- from other people.", "opts": ["secret", "secretly", "secrecy", "secrets"], "ans": 0, "exp": "判斷步驟：1. keep + 受詞（your password）+ 空格。2. 描述密碼的狀態，用形容詞。3. 選 secret。secretly 是副詞。"}, {"n": 9, "stem": "Most employees found the training session -------.", "opts": ["use", "useful", "usefully", "usefulness"], "ans": 1, "exp": "判斷步驟：1. find + 受詞（the training session）+ 空格。2. 描述課程的狀態，用形容詞。3. 選 useful。-ly 結尾是副詞，-ness 結尾是名詞。"}, {"n": 10, "stem": "The hotel thanked the guest ------- review was very positive.", "opts": ["who", "whose", "whom", "which"], "ans": 1, "exp": "判斷步驟：1. 空格後是名詞 review，再接動詞 was。2. 「客人『的』評論」。3. 選 whose。"}, {"n": 11, "stem": "The hotel thanked the guest ------- wrote a positive review.", "opts": ["whose", "who", "which", "whom"], "ans": 1, "exp": "判斷步驟：1. 空格後直接接動詞 wrote。2. 缺主詞，先行詞是人。3. 選 who。對照上一題：whose + 名詞、who + 動詞。"}, {"n": 12, "stem": "All drivers must comply ------- the new parking regulations.", "opts": ["to", "for", "with", "at"], "ans": 2, "exp": "判斷步驟：comply with ＝ 遵守，固定搭配，選 with。這是第五次出現，請把 comply with the rules 念三遍記住。"}]}, {"kind": "p7", "heading": "Part 7 短篇閱讀（建議 9 分鐘）", "tip": "先讀題目、圈關鍵字（bins、coffee cups、NOT），再回原文找那一句。換句話說題找同義說法（next to＝near）。", "passage": ["From: Linda Park, Office Manager", "To: All Staff", "Subject: New Recycling Bins", "", "Starting next Monday, each floor will have three new recycling bins next to the elevators: blue for paper, green for plastic, and gray for cans.", "Please do not put food or coffee cups in any of the bins. Coffee cups should go in the regular trash cans in the kitchen.", "The cleaning staff will empty the bins every Wednesday and Friday evening.", "If you have questions, please contact me at extension 214."], "qs": [{"n": 13, "stem": "What is the purpose of the e-mail?", "opts": ["To introduce a new office manager", "To explain a new recycling system", "To announce a kitchen renovation", "To change the cleaning staff schedule"], "ans": 1, "exp": "判斷步驟：1. 看主旨 New Recycling Bins 和第一句。2. 介紹新的回收桶怎麼用 ＝ explain a new recycling system。3. 選 B。"}, {"n": 14, "stem": "Where will the new bins be placed?", "opts": ["In the kitchen", "Near the elevators", "In each office", "At the front desk"], "ans": 1, "exp": "判斷步驟：1. 找 bins 的位置：next to the elevators。2. next to ＝ 換句話說 near。3. 選 B。kitchen 是放咖啡杯的垃圾桶位置，是陷阱。"}, {"n": 15, "stem": "What should employees do with coffee cups?", "opts": ["Put them in the blue bin", "Put them in the gray bin", "Throw them in the kitchen trash cans", "Give them to the cleaning staff"], "ans": 2, "exp": "判斷步驟：1. 找 coffee cups：should go in the regular trash cans in the kitchen。2. 選 C。"}, {"n": 16, "stem": "What is NOT mentioned in the e-mail?", "opts": ["When the bins will be emptied", "How to contact Ms. Park", "The color of the paper bin", "The cost of the new bins"], "ans": 3, "exp": "判斷步驟：NOT 題逐一回原文打勾。A：every Wednesday and Friday，有。B：extension 214，有。C：blue for paper，有。D：價格完全沒提，選 D。"}]}, {"kind": "part2", "heading": "Part 2 聽力應答（建議 6 分鐘）", "tip": "Didn't／Aren't 開頭的否定疑問句，把 not 拿掉再理解；Why don't you／we 是建議，刪掉 Because；聽到 or 就刪掉 Yes 開頭的選項。", "qs": [{"n": 17, "stem": "Didn't Mr. Lee send the invoice yesterday?", "opts": ["Yes, I received it this morning.", "He's a nice voice.", "Send it to Lee Street."], "ans": 0, "exp": "判斷步驟：1. 把 not 拿掉：Did Mr. Lee send the invoice yesterday?。2. A「有，我今天早上收到了」，對應。3. B 用 invoice／voice 發音陷阱；C 重複 send、Lee。", "audio": "d10_17.mp3"}, {"n": 18, "stem": "Aren't you coming to the training session?", "opts": ["No, I have a client meeting.", "It's a training manual.", "Yes, the session ended."], "ans": 0, "exp": "判斷步驟：1. 當成 Are you coming to the training session?。2. A「不去，我要見客戶」，對應。3. B 重複 training；C 雖然有 Yes 但後面說課程結束，答非所問。", "audio": "d10_18.mp3"}, {"n": 19, "stem": "Why don't we order lunch from the new café?", "opts": ["Because it's new.", "Sure, I'll get the menu.", "At twelve thirty."], "ans": 1, "exp": "判斷步驟：1. Why don't we…? ＝ 提議。2. Sure, I'll get the menu ＝ 接受提議。3. 先刪 Because 開頭的 A；C 回答時間。", "audio": "d10_19.mp3"}, {"n": 20, "stem": "Why don't you take a short break?", "opts": ["That's a good idea.", "Because it broke.", "It's a short trip."], "ans": 0, "exp": "判斷步驟：1. Why don't you…? ＝ 建議對方。2. That's a good idea ＝ 接受建議。3. B 有 Because 又用 break／broke 陷阱；C 重複 short。", "audio": "d10_20.mp3"}, {"n": 21, "stem": "Would you like tea or coffee?", "opts": ["Yes, I would.", "Coffee, please.", "In the cafeteria."], "ans": 1, "exp": "判斷步驟：1. 聽到 or ＝ 選擇疑問句，先刪 Yes 開頭的 A。2. Coffee, please ＝ 直接選。3. C 回答地點。", "audio": "d10_21.mp3"}, {"n": 22, "stem": "Is the meeting on Tuesday or Thursday?", "opts": ["It's been moved to Thursday.", "Yes, it's on Tuesday.", "For about an hour."], "ans": 0, "exp": "判斷步驟：1. 有 or，先刪 Yes 開頭的 B。2. It's been moved to Thursday ＝ 改到週四，選 A。3. C 回答多久，不是哪一天。", "audio": "d10_22.mp3"}]}, {"kind": "talk", "heading": "Part 3 兩人對話（建議 4 分鐘）", "tip": "播放前先讀三題，圈出 problem、when、suggest。聽到 Why don't you…? 後面就是建議題的答案。", "audio": "d10_S.mp3", "script": ["Woman: Hi, Tom. Did you see that the printer on our floor is broken again?", "Man: Yes, I noticed this morning. I already called the repair company, but they can't come until Thursday.", "Woman: That's a problem. I need to print fifty copies of the sales report for tomorrow's meeting.", "Man: Why don't you use the printer on the fourth floor? It's working fine, and nobody uses it much."], "qs": [{"n": 23, "stem": "What problem are the speakers discussing?", "opts": ["A meeting was canceled", "A printer is not working", "A report has errors", "The fourth floor is closed"], "ans": 1, "exp": "判斷步驟：1. 主旨題聽開頭：the printer on our floor is broken again。2. broken ＝ 換句話說 not working。3. 選 B。"}, {"n": 24, "stem": "When will the repair company come?", "opts": ["This morning", "Tomorrow", "Thursday", "Next week"], "ans": 2, "exp": "判斷步驟：1. 聽 they can't come until Thursday。2. 選 C。tomorrow 是開會的時間，是陷阱。"}, {"n": 25, "stem": "What does the man suggest?", "opts": ["Calling the repair company again", "Postponing the meeting", "Using another printer", "Printing fewer copies"], "ans": 2, "exp": "判斷步驟：1. 聽到 Why don't you…? ＝ 建議。2. use the printer on the fourth floor ＝ use another printer。3. 選 C。"}]}]};</script><script src="app.js"></script></body></html>
